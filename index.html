<style>

.tab:focus-visible{outline:3px solid var(--compare);outline-offset:-3px}
.pane{display:block;width:100%;border:0;min-height:calc(100vh - 52px)}
.pane[hidden]{display:none}
</style>

};
const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const tabs = [...document.querySelectorAll('.tab')];

// 5つの教材をそれぞれ読み込む（タブを切り替えても、途中の状態はそのまま残る）
for (const [key, b64] of Object.entries(APPS)) {
  document.getElementById('pane-' + key).srcdoc = decode(b64);
}

// 教材の高さに合わせて枠の高さを変える
addEventListener('message', e => {
  const d = e.data;
  if (!d || !APPS[d.app]) return;
  document.getElementById('pane-' + d.app).style.height = d.h + 'px';
});

function show(key) {
  tabs.forEach(t => {
    const on = t.dataset.app === key;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    document.getElementById('pane-' + t.dataset.app).hidden = !on;
  });
  scrollTo(0, 0);
}
tabs.forEach((t, i) => {
  t.onclick = () => show(t.dataset.app);
  t.onkeydown = e => {
    const move = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!move) return;
    const next = tabs[(i + move + tabs.length) % tabs.length];
    next.focus(); show(next.dataset.app);
  };
});
show('game');
</script>
